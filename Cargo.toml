[package]
name = "speedemon"
version = "0.1.0"
edition = "2024"
description = "A modern, thread-safe rate limiting library for Rust featuring four industry-standard algorithms with composable multi-limiter and contextual bandit-driven algorithm selection."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sean/speedemon"
readme = "README.md"
keywords = ["rate-limit", "rate-limiter", "throttle", "token-bucket", "sliding-window"]
categories = ["algorithms", "concurrency", "network-programming"]

[dependencies]
dashmap = "6.1"
nalgebra = "0.33"
thiserror = "1"
tokio = { version = "1.42", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "chooser"
harness = false



